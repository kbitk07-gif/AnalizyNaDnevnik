<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Анализатор анализов крови</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef } = React;

function parseAnalyses(text) {
  const values = {};
  const lines = text.split('\n');
  let currentName = '';
  let currentValue = '';
  let lineIndex = 0;

  while (lineIndex < lines.length) {
    const line = lines[lineIndex].trim();
    if (line === '' || line === 'Подтверждено' || line === 'Получение образца') {
      lineIndex++;
      continue;
    }
    currentName = line;
    lineIndex++;
    while (lineIndex < lines.length && lines[lineIndex].trim() === '') lineIndex++;
    if (lineIndex < lines.length) {
      currentValue = lines[lineIndex].trim();
      lineIndex++;
    }
    while (lineIndex < lines.length && lines[lineIndex].trim() === '') lineIndex++;
    if (lineIndex < lines.length) {
      const refLine = lines[lineIndex].trim();
      if (refLine.includes('-') || refLine.includes('<') || refLine === '') lineIndex++;
    }
    while (lineIndex < lines.length && lines[lineIndex].trim() === '') lineIndex++;
    if (lineIndex < lines.length) {
      const unitLine = lines[lineIndex].trim();
      if (unitLine && unitLine !== 'Подтверждено' && unitLine !== 'Получение образца' && !unitLine.includes('-') && !unitLine.includes('<')) {
        lineIndex++;
      }
    }
    while (lineIndex < lines.length) {
      const l = lines[lineIndex].trim();
      if (l === 'Подтверждено' || l === 'Получение образца') { lineIndex++; break; }
      lineIndex++;
    }
    if (currentName && currentValue) values[currentName] = currentValue;
  }
  return values;
}

function formatOutput(values) {
  const get = (keys) => {
    for (const key of keys) { if (values[key]) return values[key]; }
    return '—';
  };
  const hb = get(['Гемоглобин']);
  const eritro = get(['Эритроциты']);
  const hematocrit = get(['Гематокрит']);
  const thrombo = get(['Тромбоциты']);
  const leuko = get(['Лейкоциты']);
  const glucose = get(['Глюкоза (сахар крови)', 'Глюкоза']);
  const creatinine = get(['Креатинин']);
  const urea = get(['Мочевина']);
  const bilirubinTotal = get(['Билирубин общий']);
  const bilirubinDirect = get(['Билирубин прямой']);
  const totalProtein = get(['Общий белок']);
  const ast = get(['Аспартатаминотрансфераза (АСТ)', 'АСТ']);
  const alt = get(['Аланинаминотрансфераза (АЛТ)', 'АЛТ']);
  const potassium = get(['Калий']);
  const sodium = get(['Натрий']);
  const fibrinogen = get(['Определение фибриногена в плазме крови на анализаторе', 'Фибриноген']);
  const aptt = get(['Определение активированного частичного тромбопластинового времени (АЧТВ) в плазме крови на анализато', 'АЧТВ']);
  const pt = get(['Протромбиновое время']);
  const inr = get(['МНО']);
  const pti = get(['Протромбиновый индекс']);

  let result = `Общий анализ крови: `;
  result += `Гемоглобин (Hb):${hb}г/л `;
  result += `Эритроциты:${eritro}×10¹²/л `;
  result += `Гематокрит (Нt):${hematocrit}% `;
  result += `Тромбоциты:${thrombo}×10⁹/л `;
  result += `Лейкоциты:${leuko}×10⁹/л `;
  result += `Биохимический анализ крови: `;
  result += `Глюкоза:${glucose}ммоль/л `;
  result += `Креатинин:${creatinine}мкмоль/л `;
  result += `Мочевина:${urea}ммоль/л `;
  result += `Билирубин общий:${bilirubinTotal}мкмоль/л `;
  result += `Билирубин прямой:${bilirubinDirect}мкмоль/л `;
  result += `Общий белок:${totalProtein}г/л `;
  result += `АСТ:${ast}Ед/л `;
  result += `АЛТ:${alt}Ед/л `;
  result += `Калий (К):${potassium}ммоль/л `;
  result += `Натрий (Na):${sodium}ммоль/л `;
  result += `Коагулограмма: `;
  result += `Фибриноген:${fibrinogen}г/л `;
  result += `АЧТВ:${aptt}секунд `;
  result += `Протромбиновое время (ПВ):${pt}секунд `;
  result += `МНО:${inr} `;
  result += `ПТИ:${pti}%`;
  return result;
}

function App() {
  const [inputText, setInputText] = useState('');
  const [outputText, setOutputText] = useState('');
  const [images, setImages] = useState([]);
  const [copied, setCopied] = useState(false);
  const [showDeploy, setShowDeploy] = useState(false);
  const fileInputRef = useRef(null);

  const handleParse = () => {
    const values = parseAnalyses(inputText);
    const result = formatOutput(values);
    setOutputText(result);
  };

  const handleCopy = () => {
    navigator.clipboard.writeText(outputText);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleImageUpload = (e) => {
    const files = e.target.files;
    if (!files) return;
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const target = event.target;
        if (target && target.result) {
          setImages(prev => [...prev, target.result]);
        }
      };
      reader.readAsDataURL(file);
    });
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  const removeImage = (index) => {
    setImages(prev => prev.filter((_, i) => i !== index));
  };

  const handleClear = () => { setInputText(''); setOutputText(''); };
  const handleClearImages = () => { setImages([]); };

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
      <div className="max-w-6xl mx-auto">
        <div className="text-center mb-8">
          <h1 className="text-3xl md:text-4xl font-bold text-indigo-800 mb-2">🩺 Анализатор анализов крови</h1>
          <p className="text-gray-600 mb-3">Вставьте результаты анализов и получите форматированный вывод</p>
          <button
            onClick={() => setShowDeploy(!showDeploy)}
            className="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-5 rounded-full text-sm transition-all shadow-md hover:shadow-lg"
          >
            🌐 {showDeploy ? 'Скрыть инструкции' : 'Как опубликовать сайт 24/7?'}
          </button>
        </div>

        {showDeploy && (
          <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 border-2 border-green-200">
            <h2 className="text-2xl font-bold text-green-700 mb-4">🚀 Как опубликовать сайт бесплатно (24/7)</h2>
            <p className="text-gray-600 mb-4">Этот файл — один HTML. Его можно залить куда угодно:</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="bg-gradient-to-br from-teal-50 to-teal-100 rounded-xl p-5 border border-teal-200">
                <div className="text-3xl mb-2">⚡</div>
                <h3 className="font-bold text-teal-800 text-lg mb-2">Netlify Drop</h3>
                <p className="text-sm text-gray-600 mb-3">Просто перетащите этот HTML-файл</p>
                <ol className="text-sm text-gray-700 space-y-1 list-decimal list-inside">
                  <li>Сохраните этот файл как <code className="bg-white px-1 rounded">index.html</code></li>
                  <li>Зайдите на <a href="https://app.netlify.com/drop" target="_blank" className="text-teal-600 underline font-semibold">app.netlify.com/drop</a></li>
                  <li>Перетащите файл на страницу</li>
                  <li>Готово! Получите ссылку</li>
                </ol>
                <a href="https://app.netlify.com/drop" target="_blank" className="mt-3 inline-block bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-all">Открыть Netlify Drop →</a>
              </div>
              <div className="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-5 border border-gray-200">
                <div className="text-3xl mb-2">▲</div>
                <h3 className="font-bold text-gray-800 text-lg mb-2">Vercel</h3>
                <p className="text-sm text-gray-600 mb-3">Быстрый деплой</p>
                <ol className="text-sm text-gray-700 space-y-1 list-decimal list-inside">
                  <li>Зарегистрируйтесь на <a href="https://vercel.com" target="_blank" className="text-blue-600 underline font-semibold">vercel.com</a></li>
                  <li>Загрузите HTML-файл</li>
                  <li>Получите ссылку</li>
                </ol>
                <a href="https://vercel.com/new" target="_blank" className="mt-3 inline-block bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-all">Открыть Vercel →</a>
              </div>
              <div className="bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-5 border border-purple-200">
                <div className="text-3xl mb-2">🐙</div>
                <h3 className="font-bold text-purple-800 text-lg mb-2">GitHub Pages</h3>
                <p className="text-sm text-gray-600 mb-3">Полностью бесплатно</p>
                <ol className="text-sm text-gray-700 space-y-1 list-decimal list-inside">
                  <li>Создайте репозиторий на GitHub</li>
                  <li>Загрузите index.html</li>
                  <li>Settings → Pages → включите</li>
                </ol>
                <a href="https://pages.github.com" target="_blank" className="mt-3 inline-block bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-all">Открыть GitHub Pages →</a>
              </div>
            </div>
            <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
              <p className="text-sm text-yellow-800">💡 <strong>Самый быстрый способ:</strong> Сохраните эту страницу (Ctrl+S) и перетащите файл на <a href="https://app.netlify.com/drop" target="_blank" className="underline font-semibold">app.netlify.com/drop</a> — получите ссылку за 30 секунд!</p>
            </div>
          </div>
        )}

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div className="space-y-6">
            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-xl font-semibold text-indigo-700 mb-4">📋 Текст анализов</h2>
              <textarea
                className="w-full h-64 p-4 border-2 border-indigo-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all resize-none text-sm font-mono"
                placeholder="Вставьте сюда результаты анализов..."
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
              />
              <div className="flex gap-3 mt-4">
                <button onClick={handleParse} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md hover:shadow-lg active:scale-95">⚡ Обработать</button>
                <button onClick={handleClear} className="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-6 rounded-xl transition-all">🗑️ Очистить</button>
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-xl font-semibold text-indigo-700 mb-4">📷 Фотографии</h2>
              <div className="border-2 border-dashed border-indigo-200 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-all" onClick={() => fileInputRef.current?.click()}>
                <div className="text-4xl mb-2">📸</div>
                <p className="text-gray-500">Нажмите для загрузки фотографий</p>
                <p className="text-gray-400 text-sm mt-1">JPG, PNG, GIF — несколько файлов</p>
              </div>
              <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" />
              {images.length > 0 && (
                <div className="mt-4">
                  <div className="flex justify-between items-center mb-3">
                    <span className="text-sm text-gray-600">Загружено: {images.length} фото</span>
                    <button onClick={handleClearImages} className="text-sm text-red-500 hover:text-red-700 transition-colors">Удалить все</button>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    {images.map((img, index) => (
                      <div key={index} className="relative group">
                        <img src={img} alt={`Фото ${index + 1}`} className="w-full h-32 object-cover rounded-lg border-2 border-gray-200" />
                        <button onClick={() => removeImage(index)} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity shadow-md">✕</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="space-y-6">
            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-xl font-semibold text-indigo-700 mb-4">📄 Результат</h2>
              {outputText ? (
                <>
                  <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4 mb-4">
                    <p className="text-sm font-mono break-words leading-relaxed text-gray-800">{outputText}</p>
                  </div>
                  <button onClick={handleCopy} className={`w-full font-semibold py-3 px-6 rounded-xl transition-all shadow-md hover:shadow-lg active:scale-95 ${copied ? 'bg-green-500 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>
                    {copied ? '✅ Скопировано!' : '📋 Копировать результат'}
                  </button>
                </>
              ) : (
                <div className="bg-gray-50 border-2 border-dashed border-gray-200 rounded-xl p-8 text-center">
                  <div className="text-4xl mb-2">📝</div>
                  <p className="text-gray-400">Результат появится здесь после обработки анализов</p>
                </div>
              )}
            </div>
            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-xl font-semibold text-indigo-700 mb-4">ℹ️ Формат вывода</h2>
              <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4">
                <p className="text-xs font-mono text-indigo-800 leading-relaxed">Общий анализ крови: Гемоглобин (Hb):[значение]г/л Эритроциты:[значение]×10¹²/л Гематокрит (Нt):[значение]% Тромбоциты:[значение]×10⁹/л Лейкоциты:[значение]×10⁹/л Биохимический анализ крови: Глюкоза:[значение]ммоль/л Креатинин:[значение]мкмоль/л Мочевина:[значение]ммоль/л Билирубин общий:[значение]мкмоль/л Билирубин прямой:[значение]мкмоль/л Общий белок:[значение]г/л АСТ:[значение]Ед/л АЛТ:[значение]Ед/л Калий (К):[значение]ммоль/л Натрий (Na):[значение]ммоль/л Коагулограмма: Фибриноген:[значение]г/л АЧТВ:[значение]секунд Протромбиновое время (ПВ):[значение]секунд МНО:[значение] ПТИ:[значение]%</p>
              </div>
            </div>
            {outputText && (
              <div className="bg-white rounded-2xl shadow-lg p-6">
                <h2 className="text-xl font-semibold text-indigo-700 mb-4">🔍 Распознанные значения</h2>
                <div className="grid grid-cols-2 gap-2 text-sm">
                  {(() => {
                    const values = parseAnalyses(inputText);
                    const displayNames = [
                      ['Гемоглобин', 'Гемоглобин'], ['Эритроциты', 'Эритроциты'], ['Гематокрит', 'Гематокрит'],
                      ['Тромбоциты', 'Тромбоциты'], ['Лейкоциты', 'Лейкоциты'], ['Глюкоза', 'Глюкоза (сахар крови)'],
                      ['Креатинин', 'Креатинин'], ['Мочевина', 'Мочевина'], ['Билирубин общ.', 'Билирубин общий'],
                      ['Билирубин прям.', 'Билирубин прямой'], ['Общий белок', 'Общий белок'],
                      ['АСТ', 'Аспартатаминотрансфераза (АСТ)'], ['АЛТ', 'Аланинаминотрансфераза (АЛТ)'],
                      ['Калий', 'Калий'], ['Натрий', 'Натрий'],
                      ['Фибриноген', 'Определение фибриногена в плазме крови на анализаторе'],
                      ['АЧТВ', 'Определение активированного частичного тромбопластинового времени (АЧТВ) в плазме крови на анализато'],
                      ['МНО', 'МНО'], ['Протр. время', 'Протромбиновое время'], ['ПТИ', 'Протромбиновый индекс'],
                    ];
                    return displayNames.map(([short, full]) => (
                      <div key={short} className="flex justify-between bg-gray-50 rounded-lg px-3 py-2">
                        <span className="text-gray-600">{short}:</span>
                        <span className="font-semibold text-indigo-700">{values[full] || '—'}</span>
                      </div>
                    ));
                  })()}
                </div>
              </div>
            )}
          </div>
        </div>
        <div className="text-center mt-8 text-gray-400 text-sm">
          <p>Анализатор анализов крови • Работает локально в браузере • Данные не отправляются на сервер</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
